<div class="field-wrap {% if field.errors %}has-error{% endif %}">
    <label for="{{ field.id_for_label }}" class="block text-crema/80 text-sm mb-2">{{ field.label }}</label>
    {{ field }}
    {% for error in field.errors %}
    <p class="field-error text-red-300 text-xs mt-1">{{ error }}</p>
    {% endfor %}
</div>
