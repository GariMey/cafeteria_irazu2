{# Datos de la reserva. Requiere: reservation, fecha, hora #}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fdf6ee;border-radius:12px;margin:0 0 16px;">
<tr>
    <td align="center" style="padding:16px 8px;width:33%;border-right:1px solid #f5e6d3;">
        <div style="font-size:12px;color:#6b3a1f;text-transform:uppercase;letter-spacing:1px;">📅 Fecha</div>
        <div style="font-family:Georgia,'Times New Roman',serif;font-size:17px;margin-top:4px;">{{ fecha }}</div>
    </td>
    <td align="center" style="padding:16px 8px;width:33%;border-right:1px solid #f5e6d3;">
        <div style="font-size:12px;color:#6b3a1f;text-transform:uppercase;letter-spacing:1px;">🕐 Hora</div>
        <div style="font-family:Georgia,'Times New Roman',serif;font-size:17px;margin-top:4px;">{{ hora }}</div>
    </td>
    <td align="center" style="padding:16px 8px;width:33%;">
        <div style="font-size:12px;color:#6b3a1f;text-transform:uppercase;letter-spacing:1px;">👥 Personas</div>
        <div style="font-family:Georgia,'Times New Roman',serif;font-size:17px;margin-top:4px;">{{ reservation.guests }}{% if reservation.table %} · Mesa {{ reservation.table.number }}{% endif %}</div>
    </td>
</tr>
</table>
{% if reservation.special_requests %}<p style="margin:0 0 16px;font-size:14px;color:#6b3a1f;">📝 {{ reservation.special_requests }}</p>{% endif %}
