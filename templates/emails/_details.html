{# Lista de datos "etiqueta: valor". Requiere: rows (lista de pares) #}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;background:#fdf6ee;border-radius:12px;margin:8px 0 16px;">
    {% for label, value in rows %}
    <tr>
        <td style="padding:{% if forloop.first %}14px{% else %}6px{% endif %} 16px {% if forloop.last %}14px{% else %}6px{% endif %};color:#6b3a1f;width:42%;vertical-align:top;">{{ label }}</td>
        <td style="padding:{% if forloop.first %}14px{% else %}6px{% endif %} 16px {% if forloop.last %}14px{% else %}6px{% endif %};font-weight:bold;">{{ value }}</td>
    </tr>
    {% endfor %}
</table>
